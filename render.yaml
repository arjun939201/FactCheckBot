services:
  - type: web
    name: fact-check
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: XAI_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4.1-fast
      - key: SEARCH_API_KEY
        sync: false
      - key: SEARCH_API_URL
        value: https://api.tavily.com/search
      - key: DATABASE_URL
        value: sqlite:///./factcheck.db