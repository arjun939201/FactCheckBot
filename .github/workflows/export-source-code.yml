name: Export complete source-code poster
on:
  push:
    paths:
      - ".github/workflows/export-source-code.yml"
      - "scripts/repository_source_export.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check Pillow Pygments
      - name: Generate complete source posters
        run: python scripts/repository_source_export.py
      - name: Upload posters and manifest
        uses: actions/upload-artifact@v6
        with:
          name: factcheckbot-complete-source-export
          path: source-code-export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
