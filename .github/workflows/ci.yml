name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - run: pip install -r requirements.txt
      - name: Prevent committing local database files
        run: if git ls-files '*.db' | grep -q .; then echo 'Tracked database files are not allowed'; exit 1; fi
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js && node --check frontend/share.js
      - name: Run Python tests
        run: pytest -q
